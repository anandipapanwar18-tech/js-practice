
<!DOCTYPE html>
<html>
    <head>
        <title>FORM</title>
        <style>

            body{
                height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
            }

            .container{
                width: 400px;
              padding: 30px;
                margin: 100px, auto;
                border:2px solid black;
                
            }
            Form{
                display: flex;
                justify-content: center;
                text-align: center;
                flex-direction: column;
                

                padding: 0;
                gap: 10px;

            }

            
        </style>
    </head>
    <body>
        <div class="container"> 
        <Form id="form">
            <input type="text" placeholder="Enter the name" id="name">
            <input type="number" placeholder="Enter the age" id="age">
            <button>Submit</button>
        </Form>
    </div>
    </body>

</html>
